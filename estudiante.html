<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel del Estudiante | Unicaribe</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #f4f6f9; min-height: 100vh; }
        .header { background: #4A1C6B; color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
        .header .logo { font-size: 20px; font-weight: 700; }
        .header .logo span { color: #F4A300; }
        .header .user-info { font-size: 14px; text-align: right; }
        .tabs { display: flex; background: white; border-bottom: 1px solid #e0e0e0; overflow-x: auto; }
        .tab { flex: 1; min-width: 110px; padding: 14px 8px; text-align: center; font-size: 13px; font-weight: 500; color: #555; cursor: pointer; border-bottom: 3px solid transparent; }
        .tab.active { color: #4A1C6B; border-bottom-color: #4A1C6B; background: #faf8fc; }
        .content { padding: 20px; max-width: 900px; margin: 0 auto; }
        .section { display: none; }
        .section.active { display: block; }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .card h3 { font-size: 16px; color: #4A1C6B; margin-bottom: 14px; }
        .materia-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
        .materia-item:last-child { border-bottom: none; }
        .materia-info strong { display: block; color: #333; font-size: 14px; }
        .materia-info span { color: #777; font-size: 13px; }
        .badge { background: #e8f5e9; color: #2e7d32; font-size: 12px; padding: 4px 10px; border-radius: 20px; }
        .btn { background: #4A1C6B; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn:hover { background: #3a1555; }
        .btn:disabled { background: #999; }
        input, select { width: 100%; padding: 11px 12px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
        .asistencia-box { text-align: center; }
        .asistencia-box input { max-width: 220px; text-align: center; letter-spacing: 2px; font-size: 16px; }
        .nota-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
        .promedio { background: #4A1C6B; color: white; padding: 14px; border-radius: 10px; text-align: center; margin-top: 16px; }
        .promedio span { font-size: 24px; font-weight: 700; }
        .mensaje { padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; display: none; }
        .mensaje.ok { background: #e8f5e9; color: #2e7d32; display: block; }
        .mensaje.error { background: #ffebee; color: #c62828; display: block; }
        .empty { text-align: center; color: #888; padding: 20px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">uni<span>caribe</span></div>
        <div class="user-info">
            <strong id="nombreEstudiante">Cargando...</strong>
            <span id="documentoEstudiante"></span>
        </div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="mostrarSeccion('materias', this)">Mis Materias</div>
        <div class="tab" onclick="mostrarSeccion('asistencia', this)">Asistencia</div>
        <div class="tab" onclick="mostrarSeccion('notas', this)">Mis Notas</div>
        <div class="tab" onclick="mostrarSeccion('inscribir', this)">Inscribirse</div>
    </div>

    <div class="content">
        <!-- Materias -->
        <div id="materias" class="section active">
            <div class="card">
                <h3>Materias inscritas</h3>
                <div id="listaMaterias">
                    <div class="empty">Cargando materias...</div>
                </div>
            </div>
        </div>

        <!-- Asistencia -->
        <div id="asistencia" class="section">
            <div class="card">
                <h3>Marcar asistencia</h3>
                <div id="msgAsistencia" class="mensaje"></div>
                <div class="asistencia-box">
                    <p style="font-size:14px; color:#555; margin-bottom:10px;">Ingresa la contraseña que te dio el profesor (válida por 10 minutos)</p>
                    <input type="text" id="claveAsistencia" placeholder="Contraseña" maxlength="8">
                    <br>
                    <button class="btn" id="btnAsistencia" onclick="marcarAsistencia()">Registrar asistencia</button>
                </div>
            </div>
        </div>

        <!-- Notas -->
        <div id="notas" class="section">
            <div class="card">
                <h3>Mis calificaciones</h3>
                <div id="listaNotas">
                    <div class="empty">Cargando notas...</div>
                </div>
            </div>
        </div>

        <!-- Inscribirse -->
        <div id="inscribir" class="section">
            <div class="card">
                <h3>Inscribir nueva materia</h3>
                <div id="msgInscripcion" class="mensaje"></div>

                <label style="font-size:13px; display:block; margin-bottom:5px;">Asignatura</label>
                <select id="selectAsignatura">
                    <option value="">Cargando materias...</option>
                </select>

                <label style="font-size:13px; display:block; margin-bottom:5px;">Grupo</label>
                <select id="selectGrupo">
                    <option value="G1">G1</option>
                    <option value="G2">G2</option>
                </select>

                <button class="btn" style="width:100%;" id="btnInscribir" onclick="inscribirMateria()">Inscribirme</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyzSNprq3OVwqFoNJgtgGo-n-ZspxSLMBMl8lvuiZ6iWNIxFLhzDnsi9W5MRN6ghYiJQg/exec";

        // Verificar si está logueado
        const estudianteId = localStorage.getItem('estudianteId');
        const nombre = localStorage.getItem('nombre');
        const documento = localStorage.getItem('documento');

        if (!estudianteId) {
            window.location.href = "index.html";
        }

        document.getElementById('nombreEstudiante').textContent = nombre || "Estudiante";
        document.getElementById('documentoEstudiante').textContent = documento || "";

        // Cargar datos al iniciar
        cargarMateriasEstudiante();
        cargarAsignaturasDisponibles();
        cargarNotas();

        function mostrarSeccion(id, tab) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            tab.classList.add('active');
        }

        async function cargarMateriasEstudiante() {
            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ accion: "obtenerMateriasEstudiante", estudianteId })
                });
                const data = await res.json();
                const contenedor = document.getElementById('listaMaterias');

                if (data.ok && data.materias.length > 0) {
                    contenedor.innerHTML = data.materias.map(m => `
                        <div class="materia-item">
                            <div class="materia-info">
                                <strong>${m.nombre}</strong>
                                <span>Grupo ${m.grupo} · ${m.dia} ${m.hora} · ${m.aula}</span>
                            </div>
                            <span class="badge">Inscrito</span>
                        </div>
                    `).join('');
                } else {
                    contenedor.innerHTML = `<div class="empty">No tienes materias inscritas aún</div>`;
                }
            } catch (e) {
                document.getElementById('listaMaterias').innerHTML = `<div class="empty">Error al cargar materias</div>`;
            }
        }

        async function cargarAsignaturasDisponibles() {
            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ accion: "obtenerAsignaturas" })
                });
                const data = await res.json();
                const select = document.getElementById('selectAsignatura');

                if (data.ok) {
                    select.innerHTML = `<option value="">-- Elige una materia --</option>` +
                        data.asignaturas.map(a => 
                            `<option value="${a.id}">${a.asignatura} (${a.grupo}) - ${a.dia}</option>`
                        ).join('');
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function inscribirMateria() {
            const asignaturaId = document.getElementById('selectAsignatura').value;
            const grupo = document.getElementById('selectGrupo').value;
            const msg = document.getElementById('msgInscripcion');
            const btn = document.getElementById('btnInscribir');

            if (!asignaturaId) {
                msg.textContent = "Selecciona una materia";
                msg.className = "mensaje error";
                return;
            }

            btn.disabled = true;
            btn.textContent = "Inscribiendo...";

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        accion: "inscribirMateria",
                        estudianteId,
                        asignaturaId,
                        grupo
                    })
                });
                const data = await res.json();

                if (data.ok) {
                    msg.textContent = data.mensaje;
                    msg.className = "mensaje ok";
                    cargarMateriasEstudiante();
                } else {
                    msg.textContent = data.mensaje;
                    msg.className = "mensaje error";
                }
            } catch (e) {
                msg.textContent = "Error de conexión";
                msg.className = "mensaje error";
            }

            btn.disabled = false;
            btn.textContent = "Inscribirme";
        }

        async function marcarAsistencia() {
            const clave = document.getElementById('claveAsistencia').value.trim();
            const msg = document.getElementById('msgAsistencia');
            const btn = document.getElementById('btnAsistencia');

            if (!clave) {
                msg.textContent = "Ingresa la contraseña";
                msg.className = "mensaje error";
                return;
            }

            btn.disabled = true;
            btn.textContent = "Registrando...";

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        accion: "marcarAsistencia",
                        estudianteId,
                        contrasena: clave
                    })
                });
                const data = await res.json();

                if (data.ok) {
                    msg.textContent = data.mensaje;
                    msg.className = "mensaje ok";
                    document.getElementById('claveAsistencia').value = "";
                } else {
                    msg.textContent = data.mensaje;
                    msg.className = "mensaje error";
                }
            } catch (e) {
                msg.textContent = "Error de conexión";
                msg.className = "mensaje error";
            }

            btn.disabled = false;
            btn.textContent = "Registrar asistencia";
        }

        async function cargarNotas() {
            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ accion: "obtenerNotasEstudiante", estudianteId })
                });
                const data = await res.json();
                const contenedor = document.getElementById('listaNotas');

                if (data.ok && data.notas.length > 0) {
                    contenedor.innerHTML = data.notas.map(n => `
                        <div class="nota-row">
                            <span>${n.tipo} (Corte ${n.corte})</span>
                            <strong>${n.nota}</strong>
                        </div>
                    `).join('');
                } else {
                    contenedor.innerHTML = `<div class="empty">Aún no tienes notas registradas</div>`;
                }
            } catch (e) {
                document.getElementById('listaNotas').innerHTML = `<div class="empty">Error al cargar notas</div>`;
            }
        }
    </script>
</body>
</html>
